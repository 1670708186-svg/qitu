<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>矿脉地图 · 王半仙</title>
    <link rel="stylesheet" href="css/spirit.css?v=2">
    <link rel="stylesheet" href="css/starla.css?v=2">
    <meta name="theme-color" content="#0d0f16">
    <script src="js/config.js?v=2"></script>
    <style>
        /* ═══════ 原有模块样式 ═══════ */
        .mine-header { text-align: center; padding: 1.2rem 0 1rem; }
        .mine-title { font-size: 1.55rem; letter-spacing: 7px; font-weight: 300; color: rgba(255,255,255,.95); text-indent: 7px; }
        .mine-sub { font-size: 0.82rem; color: var(--text-dim); margin-top: 0.4rem; letter-spacing: 2px; }
        .score-top { display: flex; align-items: center; gap: 1.2rem; }
        .score-ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
        .score-ring svg { transform: rotate(-90deg); }
        .score-ring .bg { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 7; }
        .score-ring .fill { fill: none; stroke-width: 7; stroke-linecap: round; stroke: url(#gradS);
            transition: stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1); filter: drop-shadow(0 0 6px rgba(124,107,214,.5)); }
        .score-val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .score-val .n { font-size: 1.7rem; font-weight: 300; color: rgba(255,255,255,.92); }
        .score-val .n small { font-size: 0.7rem; color: var(--text-dim); font-weight: 400; }
        .score-val .l { font-size: 0.62rem; color: var(--text-dim); }
        .score-info { flex: 1; }
        .score-grade { font-size: 1.05rem; color: #e9e6f6; font-weight: 600; letter-spacing: 1px; }
        .score-label { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.3rem; line-height: 1.7; }
        .timeline { position: relative; padding-left: 1.1rem; }
        .timeline::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px;
            background: linear-gradient(180deg, rgba(124,107,214,.5), rgba(124,107,214,.5), rgba(184,174,232,.32)); border-radius: 2px; }
        .tl-item { position: relative; padding: 0.55rem 0 0.55rem 0.9rem; }
        .tl-item::before { content: ''; position: absolute; left: -1.08rem; top: 1.05rem; width: 10px; height: 10px; border-radius: 50%;
            background: rgba(20,20,32,.9); border: 2px solid rgba(124,107,214,.6); }
        .tl-item.now::before { border-color: #e9e6f6; box-shadow: 0 0 10px rgba(124,107,214,.6); }
        .tl-item.now { background: linear-gradient(135deg, rgba(124,107,214,.07), rgba(184,174,232,.16)); border-radius: 12px; }
        .tl-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
        .tl-gz { font-size: 1.1rem; font-weight: 700; color: #e9e6f6; font-family: "STKaiti","KaiTi",serif; }
        .tl-age { font-size: 0.7rem; color: var(--text-dim); }
        .tl-ss { font-size: 0.66rem; color: #b8aee8; background: rgba(184,174,232,.26); border: 1px solid rgba(124,107,214,.3);
            padding: 0.1rem 0.5rem; border-radius: 999px; }
        .tl-year { font-size: 0.72rem; color: var(--text-hint); }
        .tl-note { font-size: 0.76rem; color: var(--text-dim); margin-top: 0.3rem; line-height: 1.6; }
        .ev-item { display: flex; gap: 0.7rem; padding: 0.65rem 0.2rem; border-bottom: 1px dashed rgba(255,255,255,.07); }
        .ev-item:last-child { border-bottom: none; }
        .ev-icon { font-size: 1.4rem; flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(124,107,214,.3)); }
        .ev-main { flex: 1; min-width: 0; }
        .ev-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
        .ev-year { font-size: 0.95rem; font-weight: 700; color: #e9e6f6; }
        .ev-age { font-size: 0.66rem; color: var(--text-hint); }
        .ev-type { font-size: 0.64rem; color: #b8aee8; background: rgba(184,174,232,.26); border: 1px solid rgba(124,107,214,.3);
            padding: 0.1rem 0.45rem; border-radius: 999px; }
        .ev-title { font-size: 0.85rem; color: rgba(255,255,255,.85); margin-top: 0.25rem; font-weight: 500; }
        .ev-desc { font-size: 0.74rem; color: var(--text-dim); line-height: 1.65; margin-top: 0.2rem; }
        .ev-future { border: 1px solid rgba(184,174,232,.60); background: linear-gradient(135deg, rgba(184,174,232,.16), rgba(124,107,214,.05));
            border-radius: 12px; padding: 0.55rem 0.7rem; margin-top: 0.4rem; }
        .ev-future .ev-type { color: #e9e6f6; background: rgba(184,174,232,.32); border-color: rgba(124,107,214,.4); }
        .no-data { text-align: center; padding: 3.5rem 1rem; color: var(--text-dim); }
        .no-data a { color: var(--lavender); }
        .no-data .empty-orb { display: block; width: 180px; height: 180px; margin: 0 auto 0.9rem; border-radius: 50%; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
    <style>
        /* ═══════ 新增框架样式（年度/月度切换 + 矿脉地图 + 弹窗） ═══════ */
        .mine-head { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 0.2rem 0.9rem; }
        .mine-head .t { font-size: 1.45rem; font-weight: 300; letter-spacing: 7px; text-indent: 7px; color: #f2f0f7; }
        .mine-head .switch-btn { font-size: 0.7rem; color: var(--text-dim); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 0.26rem 0.8rem; cursor: pointer; background: rgba(255,255,255,.04); letter-spacing: 1px; }
        .mine-head .switch-btn:active { border-color: rgba(217,87,138,.5); color: #ffb3cf; }
        .seg-switch { display: flex; gap: 0.4rem; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 3px; margin-bottom: 0.9rem; }
        .seg-switch .seg { flex: 1; text-align: center; height: 36px; line-height: 36px; border-radius: 999px; font-size: 0.78rem; letter-spacing: 3px; color: rgba(255,255,255,.42); cursor: pointer; transition: all .25s; font-weight: 300; }
        .seg-switch .seg.on { background: rgba(30,18,28,.65); border: 1px solid rgba(160,72,96,.8); color: #f0e6ec; box-shadow: 0 0 14px rgba(140,63,82,.3), inset 0 0 10px rgba(140,63,82,.2); line-height: 34px; }
        .sec-label { display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; color: var(--text-dim); letter-spacing: 2px; margin: 0.2rem 0 0.5rem; }
        .sec-label .hint { font-size: 0.6rem; color: var(--text-hint); letter-spacing: 1px; }
        .chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 16px; }
        .chart-scroll::-webkit-scrollbar { height: 3px; }
        .chart-scroll::-webkit-scrollbar-thumb { background: rgba(124,107,214,.35); border-radius: 3px; }
        .line-chart { display: block; width: 100%; height: auto; }
        .chart-card { padding: 1rem 0.9rem 0.9rem; }
        .chart-tip { font-size: 0.62rem; color: var(--text-hint); margin-top: 0.5rem; line-height: 1.8; letter-spacing: 1px; }
        .legend { display: flex; flex-wrap: wrap; gap: 0.55rem; margin: 0.6rem 0 0.2rem; }
        .legend .lg { display: inline-flex; align-items: center; gap: 4px; font-size: 0.6rem; color: var(--text-dim); letter-spacing: 1px; }
        .legend .lg i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .pick-card { position: relative; overflow: hidden; margin-top: 0.6rem; padding: 1.1rem 1rem 1rem; border-radius: 20px;
            background: radial-gradient(70% 120% at 88% 0%, rgba(233,196,106,.18), transparent 60%), radial-gradient(50% 90% at 0% 100%, rgba(217,87,138,.08), transparent 60%), rgba(255,255,255,.04);
            border: 1px solid rgba(233,196,106,.28); }
        .pick-card .pc-hd { display: flex; align-items: center; gap: 0.5rem; }
        .pick-card .pc-emoji { font-size: 1.6rem; filter: drop-shadow(0 0 10px rgba(233,196,106,.6)); }
        .pick-card .pc-year { font-size: 1.05rem; color: #f2f0f7; letter-spacing: 2px; font-weight: 300; }
        .pick-card .pc-grade { font-size: 0.62rem; color: #e9c46a; border: 1px solid rgba(233,196,106,.5); border-radius: 999px; padding: 2px 8px; letter-spacing: 1px; }
        .pick-card .pc-title { font-size: 0.85rem; color: #e9c46a; margin-top: 0.55rem; letter-spacing: 1px; }
        .pick-card .pc-quote { font-size: 0.76rem; color: var(--text-dim); line-height: 1.8; margin-top: 0.35rem; letter-spacing: .5px; }
        .pick-card .pc-quote b { color: #e9c46a; font-weight: 500; }
        .pick-card .pc-btn { display: block; width: 100%; height: 42px; margin-top: 0.8rem; border: 1px solid rgba(233,196,106,.5); border-radius: 999px; background: rgba(233,196,106,.12); color: #e9c46a; font-size: 0.78rem; letter-spacing: 3px; cursor: pointer; }
        .pop-mask { position: fixed; inset: 0; z-index: 220; display: flex; align-items: center; justify-content: center;
            background: rgba(5,6,10,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            opacity: 0; pointer-events: none; transition: opacity .3s; }
        .pop-mask.show { opacity: 1; pointer-events: auto; }
        .pop-box { width: min(86vw, 360px); max-height: 76vh; overflow-y: auto; background: rgba(18,18,28,.95); border: 1px solid rgba(140,63,82,.5); border-radius: 20px; padding: 1.2rem 1.1rem 1rem;
            box-shadow: 0 16px 60px rgba(0,0,0,.6), 0 0 40px rgba(217,87,138,.1);
            transform: translateY(16px) scale(.97); transition: transform .32s cubic-bezier(.34,1.4,.64,1); }
        .pop-mask.show .pop-box { transform: none; }
        .pop-hd { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.7rem; }
        .pop-orb { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
            background: radial-gradient(circle, rgba(184,174,232,.5) 0%, rgba(124,107,214,.2) 50%, transparent 80%); box-shadow: 0 0 16px rgba(124,107,214,.35); }
        .pop-hd .nm { font-size: 0.92rem; color: #f2f0f7; font-weight: 500; letter-spacing: 1px; }
        .pop-hd .rs { font-size: 0.64rem; color: var(--text-hint); margin-top: 1px; }
        .pop-body { font-size: 0.8rem; color: var(--text-main); line-height: 1.95; letter-spacing: .4px; }
        .pop-body .sig { margin: 0.45rem 0; padding: 0.6rem 0.7rem; border-radius: 12px; font-size: 0.74rem; line-height: 1.85;
            background: rgba(233,196,106,.07); border: 1px dashed rgba(233,196,106,.3); color: rgba(255,255,255,.8); }
        .pop-body .sig b { color: #e9c46a; font-weight: 500; }
        .pop-body .acts { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.6rem; }
        .pop-body .acts .ac { display: flex; align-items: center; gap: 0.45rem; font-size: 0.74rem; color: rgba(255,255,255,.82); }
        .pop-body .acts .ac::before { content: '✓'; color: #4fd8c9; flex-shrink: 0; }
        .pop-btn { width: 100%; height: 42px; margin-top: 0.9rem; border: none; border-radius: 999px; cursor: pointer;
            background: linear-gradient(90deg, #c78a8a, #d9578a 48%, #7c6bd6); color: #fff; font-size: 13px; font-weight: 500; letter-spacing: 3px; }
        .switch-sheet { width: 100%; max-width: 480px; background: rgba(18,18,28,.96); border: 1px solid rgba(124,107,214,.28); border-radius: 22px 22px 0 0; padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom,0px)); transform: translateY(40px); transition: transform .32s cubic-bezier(.32,.72,0,1); }
        .pop-mask.show .switch-sheet { transform: none; }
        .switch-hd { font-size: 0.9rem; color: #f2f0f7; letter-spacing: 2px; margin-bottom: 0.8rem; text-align: center; }
        .switch-opt { display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 0.9rem; border-radius: 16px; cursor: pointer; transition: all .2s; }
        .switch-opt:active { background: rgba(124,107,214,.12); }
        .switch-opt .ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(124,107,214,.6) 45%, rgba(217,87,138,.35) 80%, transparent); }
        .switch-opt .tx { flex: 1; min-width: 0; }
        .switch-opt .nm { font-size: 0.86rem; color: var(--text-main); letter-spacing: 1px; }
        .switch-opt .ds { font-size: 0.62rem; color: var(--text-hint); margin-top: 0.14rem; }
        .switch-opt .cur { font-size: 0.62rem; color: #e9c46a; border: 1px solid rgba(233,196,106,.45); border-radius: 999px; padding: 1px 8px; }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="spirit-glow"></div>
    <canvas id="spirit-canvas"></canvas>

    <div class="container">
        <!-- 顶栏 -->
        <div class="mine-head">
            <div class="t">矿 脉</div>
            <span class="switch-btn" id="switchBtn">⇄ 切换</span>
        </div>

        <!-- 胶囊切换 -->
        <div class="seg-switch" id="segSwitch">
            <span class="seg on" data-v="year">年度矿脉</span>
            <span class="seg" data-v="month">月度时机</span>
        </div>

        <!-- ═══ 年度视图（原有模块 + 新增地图） ═══ -->
        <div id="yearView">
            <div id="scoreCard"></div>            <!-- 原有：年度淘金评分 -->
            <div id="timelineCard"></div>         <!-- 原有：大运时间轴 -->
            <div class="card chart-card">
                <div class="sec-label"><span>年度矿脉地图</span><span class="hint">↔ 左右滑动查看更多年份</span></div>
                <div class="chart-scroll" id="yearScroll">
                    <svg id="yearChart" class="line-chart" viewBox="0 0 720 300"></svg>
                </div>
                <div class="legend" id="yearLegend"></div>
                <div class="chart-tip">● 年度评分 = 喜用神状态(40) + 财官引动(40) + 结构爆发(20)　节点为当年矿种信号</div>
            </div>
            <div class="pick-card" id="pickCard"></div>   <!-- 新增：年度精选 -->
            <div id="recentCard"></div>            <!-- 原有：近年关键节点 -->
            <div id="futureCard"></div>            <!-- 原有：升职窗口期 -->
            <div id="quoteCard"></div>             <!-- 原有：半仙注解 -->
        </div>

        <!-- ═══ 月度视图（新增） ═══ -->
        <div id="monthView" style="display:none">
            <div class="card chart-card">
                <div class="sec-label"><span>月度时机 · GRI 指数</span><span class="hint">点击节点查看行动指令</span></div>
                <svg id="monthChart" class="line-chart" viewBox="0 0 720 300"></svg>
                <div class="legend" id="monthLegend"></div>
                <div class="chart-tip">● 柔金=暴富矿 · 青蓝=晋升窗口 · 紫=灵感波段 · 柔绿=人脉共振 · 灰=稳固期</div>
            </div>
        </div>

        <div class="disclaimer">矿脉内容基于传统五行、大运流年等文化元素推演，仅供传统文化研究与娱乐参考。</div>
    </div>

    <!-- 半仙点评 / 信号详情 弹窗 -->
    <div class="pop-mask" id="popMask" onclick="if(event.target===this)MineApp.closePop()">
        <div class="pop-box" id="popBox"></div>
    </div>

    <!-- 切换用户弹层 -->
    <div class="pop-mask" id="switchMask" onclick="if(event.target===this)MineApp.closeSwitch()">
        <div class="switch-sheet" id="switchSheet"></div>
    </div>

    <script src="js/starfield.js?v=2"></script>
    <script src="js/spirit.js?v=2"></script>
    <script src="js/opening.js?v=2"></script>
    <script src="js/auth.js?v=1"></script>
    <script>
    /* ===== 原有模块渲染（评分环 / 大运时间轴 / 关键节点 / 升职窗口 / 半仙注解） ===== */
    (function () {
        'use strict';
        function loadReport() {
            var data = null;
            try { var raw = sessionStorage.getItem('reportData'); if (raw) data = JSON.parse(raw); } catch (e) {}
            if (!data) {
                try {
                    var list = JSON.parse(localStorage.getItem('qitu_reports') || '[]');
                    var rid = new URLSearchParams(location.search).get('id') || sessionStorage.getItem('currentReportId');
                    var hit = rid ? list.find(function (r) { return r.report_id === rid; }) : list[0];
                    if (hit && hit.data) data = hit.data;
                } catch (e) {}
            }
            return data;
        }
        var d = loadReport();
        if (!d) {
            document.getElementById('scoreCard').innerHTML = '<div class="no-data">' +
                '<canvas id="emptyOrb" class="empty-orb" width="180" height="180"></canvas>' +
                '<p>还没有报告数据，矿脉无法勘探</p>' +
                '<p><a href="index.html">← 先测一次职场天赋</a></p></div>';
            // 灵体效果（图1风格：蓝紫涟漪 + 中心柔光 + 环绕粒子）
            var oc = document.getElementById('emptyOrb');
            if (oc && window.SpiritOrb) {
                setTimeout(function () { window.SpiritOrb.create(oc); }, 50);
            }
            return;   // 无报告时原模块留空，新增矿脉地图展示示例数据
        }

        var career = d.career || (d.analysis && d.analysis.career) || {};
        var dayun = d.dayun || {};
        var steps = dayun.steps || [];
        var events = ((d.analysis && d.analysis.special_events) || {}).events || [];
        var matchScore = career.match_score || 0;
        var nowYear = new Date().getFullYear();
        var future = events.filter(function (e) { return e.year >= nowYear; }).slice(0, 6);
        var recent = events.filter(function (e) { return e.year < nowYear && e.year >= nowYear - 6; }).reverse();

        /* 1. 年度淘金评分（原有） */
        var C = 2 * Math.PI * 42;
        document.getElementById('scoreCard').innerHTML = '<div class="card">' +
            '<div class="card-title">年度淘金评分</div>' +
            '<div class="score-top">' +
            '<div class="score-ring"><svg viewBox="0 0 96 96" width="96" height="96">' +
            '<defs><linearGradient id="gradS" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" stop-color="#5B8DEF"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient></defs>' +
            '<circle class="bg" cx="48" cy="48" r="42"/>' +
            '<circle class="fill" id="scoreFill" cx="48" cy="48" r="42" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/>' +
            '</svg><div class="score-val"><div class="n"><span id="scoreNum">0</span><small>分</small></div>' +
            '<div class="l">天赋适配度</div></div></div>' +
            '<div class="score-info">' +
            '<div class="score-grade">' + (matchScore >= 80 ? '黄金矿脉 · 宜主动出击' : matchScore >= 65 ? '白银矿脉 · 稳中求进' : matchScore >= 50 ? '铜矿 · 打磨技能再掘进' : '待开采 · 先溯源禀赋') + '</div>' +
            '<div class="score-label">结合十神格局与流年大势的年度评分，' +
            '分数越高，这一年越适合推进关键职业动作。</div></div></div>' +
            '<div class="score-label" style="margin-top:0.2rem">当前大运：' + (d.chart && d.chart.current_dayun ? d.chart.current_dayun.ganzhi : '—') +
            (d.chart && d.chart.current_dayun ? '（' + d.chart.current_dayun.start_age + '~' + d.chart.current_dayun.end_age + '岁）' : '') + '</div></div>';
        setTimeout(function () {
            var fill = document.getElementById('scoreFill');
            var num = document.getElementById('scoreNum');
            if (fill) fill.style.strokeDashoffset = C * (1 - Math.min(matchScore, 100) / 100);
            if (num) {
                var cur = 0;
                var timer = setInterval(function () {
                    cur += 3;
                    if (cur >= matchScore) { cur = matchScore; clearInterval(timer); }
                    num.textContent = cur;
                }, 24);
            }
        }, 200);

        /* 2. 大运时间轴（原有） */
        if (steps.length) {
            var curStep = d.chart && d.chart.current_dayun;
            document.getElementById('timelineCard').innerHTML = '<div class="card"><div class="card-title">大运矿脉 · 十年一运</div><div class="timeline">' +
                steps.map(function (s) {
                    var isNow = curStep && s.ganzhi === curStep.ganzhi;
                    return '<div class="tl-item' + (isNow ? ' now' : '') + '">' +
                        '<div class="tl-head"><span class="tl-gz">' + s.ganzhi + '</span>' +
                        '<span class="tl-ss">' + (s.shishen_gan || '') + (s.shishen_zhi ? '·' + s.shishen_zhi : '') + '</span>' +
                        '<span class="tl-age">' + s.start_age + '~' + s.end_age + '岁</span>' +
                        '<span class="tl-year">' + s.start_year + '-' + s.end_year + '年</span></div>' +
                        (isNow ? '<div class="tl-note">当前所在大运，方向：' + (s.wuxing || '—') + '。</div>' : '') +
                        '</div>';
                }).join('') + '</div></div>';
        }

        /* 3. 近年关键节点（原有） */
        if (recent.length) {
            document.getElementById('recentCard').innerHTML = '<div class="card"><div class="card-title">近年关键节点</div>' +
                recent.map(function (e) {
                    return '<div class="ev-item"><div class="ev-icon">' + (e.icon || '📌') + '</div>' +
                        '<div class="ev-main"><div class="ev-head"><span class="ev-year">' + e.year + '</span>' +
                        '<span class="ev-age">' + e.age + '岁</span><span class="ev-type">' + e.type + '</span></div>' +
                        '<div class="ev-title">' + (e.title || '') + '</div>' +
                        '<div class="ev-desc">' + (e.desc || '') + '</div></div></div>';
                }).join('') + '</div>';
        }

        /* 4. 升职窗口期（原有） */
        if (future.length) {
            document.getElementById('futureCard').innerHTML = '<div class="card"><div class="card-title">升职窗口期 · 未来矿点</div>' +
                future.map(function (e) {
                    return '<div class="ev-item ev-future"><div class="ev-icon">' + (e.icon || '💎') + '</div>' +
                        '<div class="ev-main"><div class="ev-head"><span class="ev-year">' + e.year + '年</span>' +
                        '<span class="ev-age">' + e.age + '岁</span><span class="ev-type">' + (e.type || '机会') + '</span></div>' +
                        '<div class="ev-title">' + (e.title || '') + '</div>' +
                        '<div class="ev-desc">' + (e.desc || '') + '</div></div></div>';
                }).join('') + '</div>';
        }

        /* 5. 王半仙注解（原有） */
        document.getElementById('quoteCard').innerHTML = '<div class="card"><div class="card-title">王半仙注解</div>' +
            '<div class="bx-quote" style="margin:0.3rem 0 0">“矿脉是挖出来的，不是等出来的。' +
            '我知道哪几年该使劲，但使劲这件事，还得你自己来。”<span class="by">—— 王半仙</span></div>' +
            '<a class="ex-chat-cta" href="chat.html?to=ai" style="margin-top:0.7rem;height:44px;font-size:13px">🔮 找王半仙 AI 问 →</a></div>';
    })();
    </script>

    <script src="js/glow-orb.js?v=1"></script>
    <script src="js/tabbar.js?v=6"></script>
