<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>登录 · 王半仙</title>
    <link rel="stylesheet" href="css/starla.css?v=5">
    <script src="js/config.js?v=1"></script>
    <style>
        body { min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); }
        .auth-wrap { max-width: 420px; margin: 0 auto; padding: 2rem 0.9rem 6rem; }
        .auth-header { text-align: center; margin: 1.5rem 0 2rem; }
        .auth-header .title { font-size: 2rem; letter-spacing: 0.4rem; color: #e8d9a0; }
        .auth-header .sub { font-size: 0.85rem; color: #888; margin-top: 0.5rem; }
        .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .auth-tabs button { flex: 1; padding: 0.7rem; border: 1px solid #2a2a4a; background: transparent; color: #aaa; border-radius: 8px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .auth-tabs button.active { background: rgba(184, 174, 232, 0.18); color: #e9e6f6; border-color: rgba(184, 174, 232, 0.5); font-weight: 500; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
        .code-row { display: flex; gap: 0.5rem; align-items: stretch; }
        .code-row .form-input { flex: 1; }
        .code-row .send-btn { flex: 0 0 110px; padding: 0 0.5rem; font-size: 0.85rem; white-space: nowrap; }
        .agree-hint { font-size: 0.75rem; color: #666; text-align: center; margin-top: 1.2rem; line-height: 1.6; }
        .agree-hint a { color: #c4a25a; text-decoration: none; }
        .field-error { color: #ff8080; font-size: 0.75rem; margin-top: 0.3rem; min-height: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .btn-primary { width: 100%; margin-top: 0.5rem; }
        .toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); background: rgba(26,34,38,0.95); color: #e8d9a0; padding: 0.7rem 1.2rem; border-radius: 8px; border: 1px solid #c4a25a; font-size: 0.85rem; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="spirit-glow"></div>
    <canvas id="spirit-canvas"></canvas>
    <div class="auth-wrap" style="position:relative;z-index:1;">
        <div class="auth-header">
            <div class="title serif-title">星 途 归 位</div>
            <div class="sub">登录后报告自动云端保存，换机不丢</div>
        </div>
        <div class="card">
            <div class="auth-tabs">
                <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
                <button id="tabRegister" onclick="switchTab('register')">注册</button>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input class="form-input" id="lPhone" type="tel" maxlength="11" placeholder="11 位手机号" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input class="form-input" id="lPwd" type="password" placeholder="至少 8 位">
                </div>
                <div class="field-error" id="lErr"></div>
                <button class="btn-primary" type="button" onclick="doLogin()">登 录</button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" onsubmit="return false;" hidden>
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input class="form-input" id="rPhone" type="tel" maxlength="11" placeholder="11 位手机号" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label class="form-label">昵称（选填）</label>
                    <input class="form-input" id="rNick" type="text" maxlength="16" placeholder="留空默认生成">
                </div>
                <div class="form-group" id="codeGroup" hidden>
                    <label class="form-label">短信验证码</label>
                    <div class="code-row">
                        <input class="form-input" id="rCode" maxlength="6" placeholder="6 位验证码" inputmode="numeric">
                        <button type="button" class="btn-secondary send-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input class="form-input" id="rPwd" type="password" placeholder="至少 8 位">
                </div>
                <div class="field-error" id="rErr"></div>
                <button class="btn-primary" type="button" onclick="doRegister()">注 册 并 登 录</button>
            </form>

            <p class="agree-hint">注册即代表同意<a href="agreement.html">《用户协议》</a>与<a href="privacy.html">《隐私政策》</a></p>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="js/starfield.js?v=5"></script>
    <script src="js/auth.js?v=1"></script>
    <script>
        // ===== Tab 切换 =====
        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabRegister').classList.toggle('active', !isLogin);
            document.getElementById('loginForm').hidden = !isLogin;
            document.getElementById('registerForm').hidden = isLogin;
            document.getElementById('lErr').textContent = '';
            document.getElementById('rErr').textContent = '';
        }

        // ===== Toast =====
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ===== 验证码倒计时 =====
        function startCountdown(sec) {
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            let left = sec;
            const timer = setInterval(() => {
                left--;
                if (left <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                } else {
                    btn.textContent = '重发(' + left + 's)';
                }
            }, 1000);
        }

        // ===== 发送验证码 =====
        function sendCode() {
            const phone = document.getElementById('rPhone').value.trim();
            const errEl = document.getElementById('rErr');
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                errEl.textContent = '请输入正确的中国大陆手机号';
                return;
            }
            errEl.textContent = '';
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = '发送中...';

            fetch((window.API_BASE || '') + '/api/auth/send_code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, scene: 'register' }),
            })
            .then(r => r.json().then(d => ({ ok: r.ok, d })))
            .then(({ ok, d }) => {
                if (ok) {
                    toast('验证码已发送');
                    startCountdown(60);
                } else {
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                    errEl.textContent = d.detail || '发送失败';
                }
            })
            .catch(e => {
                btn.disabled = false;
                btn.textContent = '获取验证码';
                errEl.textContent = '网络错误，请重试';
            });
        }

        // ===== 登录 =====
        function doLogin() {
            const phone = document.getElementById('lPhone').value.trim();
            const pwd = document.getElementById('lPwd').value;
            const errEl = document.getElementById('lErr');
            if (!/^1[3-9]\d{9}$/.test(phone)) { errEl.textContent = '请输入正确的手机号'; return; }
            if (pwd.length < 8) { errEl.textContent = '密码至少 8 位'; return; }
            errEl.textContent = '';

            fetch((window.API_BASE || '') + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, password: pwd }),
            })
            .then(r => r.json().then(d => ({ ok: r.ok, d })))
            .then(({ ok, d }) => {
                if (!ok) { errEl.textContent = d.detail || '登录失败'; return; }
                QituAuth.setToken(d.token);
                afterAuth();
            })
            .catch(e => { errEl.textContent = '网络错误，请重试'; });
        }

        // ===== 注册 =====
        function doRegister() {
            const phone = document.getElementById('rPhone').value.trim();
            const code = document.getElementById('rCode').value.trim();
            const pwd = document.getElementById('rPwd').value;
            const nick = document.getElementById('rNick').value.trim();
            const errEl = document.getElementById('rErr');
            if (!/^1[3-9]\d{9}$/.test(phone)) { errEl.textContent = '请输入正确的手机号'; return; }
            if (pwd.length < 8) { errEl.textContent = '密码至少 8 位'; return; }
            // 短信已配置（验证码区可见）时强制校验
            const codeGroup = document.getElementById('codeGroup');
            if (codeGroup && !codeGroup.hidden && !code) { errEl.textContent = '请输入验证码'; return; }
            errEl.textContent = '';

            fetch((window.API_BASE || '') + '/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, code: code, password: pwd, nickname: nick }),
            })
            .then(r => r.json().then(d => ({ ok: r.ok, d })))
            .then(({ ok, d }) => {
                if (!ok) { errEl.textContent = d.detail || '注册失败'; return; }
                QituAuth.setToken(d.token);
                afterAuth();
            })
            .catch(e => { errEl.textContent = '网络错误，请重试'; });
        }

        // ===== 登录/注册成功后 =====
        async function afterAuth() {
            toast('登录成功');
            // 迁移 localStorage 旧报告到账号
            await QituAuth.migrateLocalReports();
            // 回跳或进入个人中心
            const back = new URLSearchParams(location.search).get('redirect');
            const inApp = !!window.IS_NATIVE_APP;
            setTimeout(() => {
                if (back) {
                    location.href = back.replace(/^\//, '');
                } else {
                    location.href = 'profile.html';
                }
            }, 600);
        }

        // 已登录直接跳转
        if (QituAuth.isLoggedIn()) {
            location.replace('profile.html');
        } else {
            // 探测短信是否已配置：已配置才显示验证码区
            fetch((window.API_BASE || '') + '/api/auth/sms_status').then(r => r.json()).then(d => {
                if (d.configured) document.getElementById('codeGroup').hidden = false;
            }).catch(() => {});
        }
    </script>
    <script src="js/tabbar.js?v=5"></script>
</body>
</html>
