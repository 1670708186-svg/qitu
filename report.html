<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>职场天赋报告 · 王半仙</title>
    <link rel="stylesheet" href="css/spirit.css?v=2">
    <link rel="stylesheet" href="css/starla.css?v=2">
    <meta name="theme-color" content="#1a2226">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="王半仙">
    <script src="vendor/echarts.min.js" defer></script>
    <script src="js/config.js?v=2"></script>
    <style>
        /* 报告页品牌补充样式（与 spirit.css 配合） */
        .report-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
        .report-top a { color: var(--text-dim); text-decoration: none; font-size: 0.88rem; }
        .report-top a:hover { color: var(--text-main); }
        .report-top button {
            color: var(--text-dim); border: 1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.04); padding: 0.35rem 0.9rem;
            border-radius: 999px; cursor: pointer; font-size: 0.8rem;
        }
        /* 结果页副标题（AB 剧承接） */
        .ab-sub {
            text-align: center; font-size: 0.88rem; color: rgba(255,255,255,.6);
            letter-spacing: 1px; line-height: 1.9; margin: 0 0 1rem;
            font-style: italic;
        }
        .ab-sub b { color: var(--gold-light); font-weight: 600; font-style: normal; }
        /* 报告头（report.js 会控制显隐） */
        .report-header { text-align: center; padding: 0.6rem 0 1rem; }
        .report-header .title { font-size: 1.6rem; letter-spacing: 6px; font-weight: 300; color: rgba(255,255,255,.92); }
        .report-header .subtitle { color: var(--text-dim); font-size: 0.82rem; margin-top: 0.45rem; letter-spacing: 2px; }
        /* 锚点导航 */
        .anchor-nav { position: sticky; top: 0; z-index: 60; display: flex; gap: 0.4rem; overflow-x: auto;
            padding: 0.55rem 0.2rem; margin-bottom: 0.9rem; scrollbar-width: none;
            background: rgba(8,8,14,.74); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-radius: 14px; border: 1px solid rgba(255,255,255,.07); }
        .anchor-nav::-webkit-scrollbar { display: none; }
        .anchor-nav a { flex-shrink: 0; font-size: 0.76rem; color: var(--text-dim); text-decoration: none;
            padding: 0.34rem 0.8rem; border-radius: 999px; border: 1px solid transparent; transition: all .2s; }
        .anchor-nav a.on { color: #fff; background: rgba(184,174,232,.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-color: rgba(124,107,214,.4); }
        /* 报告内容里的卡片统一换肤（starla 类名微调） */
        #reportContent .card { background: var(--bg-card); border: 1px solid rgba(255,255,255,.07); border-radius: 22px; }
        #reportContent .card-title { color: var(--gold); border-bottom-color: rgba(184,174,232,.30); }
        #reportContent .pillar-card, #reportContent .summary-item,
        #reportContent .path-bar-track, #reportContent .cs-score-wrap,
        #reportContent .se-card, #reportContent .his-item, #reportContent .chat-box,
        #reportContent .dayun-timeline .dy-block { background: rgba(255,255,255,.035); border-color: rgba(255,255,255,.08); }
        #reportContent .his-card { background: rgba(255,255,255,.04); border: 1px solid rgba(184,174,232,.42); border-radius: 20px; }
        .no-data { text-align: center; padding: 3.5rem 1rem; color: var(--text-dim); }
        .no-data a { color: var(--lavender); }
    </style>
    <!-- ===== 报告模块样式（原版 report.js 渲染所需） ===== -->
    <style>
        .report-header {
            text-align: center;
            padding: 2rem 0 1rem;
        }
        .report-header .title {
            font-size: 1.8rem;
            color: var(--gold-light);
            letter-spacing: 6px;
        }
        .report-header .subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }
        /* ===== F型总览首页 ===== */
        .f-hero {
            text-align:center; padding:1.4rem 1.1rem 1.5rem; margin-bottom:0.9rem;
            background: radial-gradient(circle at 50% 0%, rgba(184,174,232,0.2), rgba(26,34,38,0.7));
            border:1px solid rgba(184,174,232,0.4); border-radius:18px;
            box-shadow:0 0 34px rgba(184,174,232,0.1);
        }
        .f-top { display:flex; align-items:center; justify-content:center; gap:0.7rem; margin-bottom:0.9rem; }
        .f-app { font-size:1rem; color:var(--gold-light); letter-spacing:3px; font-weight:700; }
        .f-tag {
            font-size:0.72rem; padding:0.2rem 0.7rem; border-radius:999px;
            background:rgba(184,174,232,0.16); border:1px solid rgba(184,174,232,0.45); color:var(--gold-light);
        }
        .f-score { line-height:1; }
        .f-num {
            font-size:4.4rem; font-weight:800; color:var(--gold-light); font-family:'Georgia',serif;
            text-shadow:0 0 26px rgba(184,174,232,0.5);
        }
        .f-unit { font-size:1.5rem; color:var(--gold); font-weight:600; margin-left:2px; }
        .f-line { font-size:1.08rem; color:var(--text-main); margin-top:0.7rem; line-height:1.7; }
        .f-line b { color:var(--gold-light); }
        .f-hook { font-size:0.9rem; color:var(--purple-light); margin-top:0.7rem; letter-spacing:1px; }
        .f-btns { display:flex; gap:0.7rem; margin-top:1.1rem; }
        .f-btn {
            flex:1; text-align:center; padding:0.8rem 0.5rem; border-radius:999px;
            text-decoration:none; font-weight:700; font-size:0.92rem; letter-spacing:1px;
        }
        .f-btn.free { background:rgba(184,174,232,.16); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(184,174,232,.45); color:#e9e6f6; }
        .f-btn.pay { background:transparent; border:1px solid rgba(255,154,138,0.55); color:#ff9a8a; }
        /* 报告内独立入口按钮 */
        .talent-cta {
            display:block; text-align:center; padding:0.8rem 0.5rem; border-radius:999px;
            text-decoration:none; font-weight:500; font-size:0.92rem; letter-spacing:1px; margin-top:0.3rem;
            background:rgba(184,174,232,.16); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            border:1px solid rgba(184,174,232,.45); color:#e9e6f6;
        }
        .fortune-cta { background:transparent; border:1px solid rgba(255,154,138,0.55); color:#ff9a8a; }
        /* 命盘总览 */
        .chart-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .summary-item {
            background: rgba(26, 34, 38, 0.5);
            border: 1px solid rgba(184, 174, 232, 0.15);
            border-radius: 10px;
            padding: 0.8rem;
            text-align: center;
        }
        .summary-item .k {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
        }
        .summary-item .v {
            font-size: 1rem;
            color: var(--gold-light);
            font-weight: 600;
        }
        /* 五行图表 */
        #wuxingChart {
            width: 100%;
            height: 260px;
        }
        /* AI 报告 markdown 渲染 */
        .ai-report-content {
            line-height: 1.9;
            color: var(--text-main);
            font-size: 0.95rem;
        }
        .ai-report-content h2 {
            color: var(--gold);
            font-size: 1.15rem;
            margin: 1.5rem 0 0.8rem;
            padding-left: 0.8rem;
            border-left: 3px solid var(--gold);
        }
        .ai-report-content p {
            margin-bottom: 0.8rem;
        }
        .ai-report-content ul {
            margin: 0.5rem 0 0.8rem 1.5rem;
        }
        .ai-report-content li {
            margin-bottom: 0.4rem;
        }
        .ai-report-content strong {
            color: var(--gold-light);
        }
        /* 学历层级 */
        .edu-level-display {
            text-align: center;
            padding: 1.5rem 0;
        }
        .edu-level-display .level {
            font-size: 1.8rem;
            color: var(--gold-light);
            font-weight: 700;
            text-shadow: 0 0 20px rgba(184, 174, 232, 0.3);
        }
        .edu-level-display .rule {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        /* 问答区 */
        .chat-section {
            margin-top: 1.5rem;
        }
        .chat-box {
            height: 320px;
            overflow-y: auto;
            background: rgba(26, 34, 38, 0.5);
            border: 1px solid rgba(184, 174, 232, 0.2);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }
        .chat-msg {
            margin-bottom: 1rem;
            max-width: 85%;
        }
        .chat-msg.user {
            margin-left: auto;
            text-align: right;
        }
        .chat-msg .bubble {
            display: inline-block;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
            text-align: left;
        }
        .chat-msg.user .bubble {
            background: rgba(184, 174, 232, 0.2);
            border: 1px solid rgba(184, 174, 232, 0.4);
        }
        .chat-msg.ai .bubble {
            background: rgba(184, 174, 232, 0.15);
            border: 1px solid rgba(184, 174, 232, 0.3);
        }
        .chat-input-row {
            display: flex;
            gap: 0.6rem;
        }
        .chat-input-row .form-input {
            flex: 1;
        }
        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .quick-q {
            padding: 0.4rem 0.9rem;
            background: rgba(184, 174, 232, 0.1);
            border: 1px solid rgba(184, 174, 232, 0.3);
            border-radius: 16px;
            color: var(--gold-light);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quick-q:hover {
            background: rgba(184, 174, 232, 0.25);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .back-btn {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .share-btn {
            color: var(--gold);
            border: 1px solid var(--gold);
            background: transparent;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .ai-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.6rem;
            border-radius: 10px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        .ai-badge.deepseek { background: rgba(127, 212, 127, 0.15); color: #7fd47f; border: 1px solid rgba(127, 212, 127, 0.3); }
        .ai-badge.fallback { background: rgba(184, 174, 232, 0.15); color: #b8aee8; border: 1px solid rgba(184, 174, 232, 0.3); }
        .no-data {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-dim);
        }
        .no-data a { color: var(--gold); }

        /* ===== v2 独立入口表单（无报告数据时的内嵌测试漏斗） ===== */
        .v2-entry-hero { text-align: center; padding: 2.2rem 1rem 1.2rem; }
        .v2e-logo {
            font-size: 2.6rem; margin-bottom: 0.6rem; color: var(--gold);
            filter: drop-shadow(0 0 14px rgba(184,174,232,0.5));
            animation: v2eFloat 4s ease-in-out infinite;
        }
        @keyframes v2eFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .v2e-title { font-size: 1.5rem; color: var(--gold-light); letter-spacing: 4px; margin: 0 0 0.5rem; }
        .v2e-sub { font-size: 0.85rem; color: var(--text-dim); letter-spacing: 1px; }
        .v2e-form {
            background: var(--bg-card); border: 1px solid rgba(184,174,232,0.2);
            border-radius: 16px; padding: 1.2rem 1.1rem; margin: 0.6rem 0 1.5rem;
        }
        .v2e-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.55rem; margin-bottom: 0.65rem; }
        .v2e-row:last-of-type { grid-template-columns: 1.4fr 1fr; }
        .v2e-input, .v2e-select {
            width: 100%; padding: 0.68rem 0.5rem; border-radius: 10px; outline: none;
            background: rgba(26,34,38,0.6); border: 1px solid rgba(184,174,232,0.25);
            color: var(--text-main); font-size: 0.9rem; text-align: center;
        }
        .v2e-select { text-align: left; appearance: none; }
        .v2e-input:focus, .v2e-select:focus { border-color: rgba(184,174,232,0.6); }
        .v2e-gender { display: flex; gap: 0.45rem; }
        .v2e-g {
            flex: 1; padding: 0.68rem 0; border-radius: 10px; cursor: pointer;
            background: rgba(26,34,38,0.6); border: 1px solid rgba(184,174,232,0.25);
            color: var(--text-dim); font-size: 0.85rem; transition: all 0.25s;
        }
        .v2e-g.active {
            background: rgba(184,174,232,0.18); border-color: var(--gold); color: var(--gold-light);
        }
        .v2e-submit {
            width: 100%; margin-top: 0.35rem; padding: 0.85rem 0; border: 1px solid rgba(184,174,232,.45); border-radius: 999px;
            background: rgba(184,174,232,.16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            color: #e9e6f6; font-size: 1rem; font-weight: 500; letter-spacing: 6px; cursor: pointer;
            transition: transform .15s, opacity .2s;
        }
        .v2e-submit:active { transform: scale(0.97); }
        .v2e-submit:disabled { opacity: 0.5; cursor: wait; }
        .v2e-err { color: #ff8a8a; font-size: 0.8rem; min-height: 1.2em; margin-top: 0.6rem; }
        .v2e-hint { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.5rem; line-height: 1.6; }
        .v2e-hint a { color: var(--gold); }
        /* 考公适配度卡片 */
        .cs-header {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            margin-bottom: 0.8rem;
        }
        .cs-score-ring {
            min-width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(184,174,232,0.25);
            background: rgba(184,174,232,0.08);
        }
        .cs-score-num {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--gold-light);
            line-height: 1;
        }
        .cs-score-unit { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
        .cs-level-info { flex: 1; }
        .cs-level {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--gold-light);
            margin-bottom: 0.5rem;
        }
        .cs-factors { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .cs-factor {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            background: rgba(184,174,232,0.12);
            border: 1px solid rgba(184,174,232,0.25);
            border-radius: 12px;
            color: var(--purple-light);
        }
        .cs-score-wrap {
            background: rgba(26,34,38,0.6);
            border-radius: 8px;
            height: 8px;
            margin: 0.6rem 0 1rem;
            overflow: hidden;
        }
        .cs-score-bar {
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(90deg, #b8aee8, #b8aee8);
            box-shadow: 0 0 8px rgba(184,174,232,0.4);
        }
        .cs-advice {
            color: var(--text-main);
            font-size: 0.92rem;
            line-height: 1.8;
        }
        /* 五大职业路径 */
        .path-best {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.1rem;
            background: linear-gradient(135deg, rgba(184,174,232,0.14), rgba(184,174,232,0.10));
            border: 1px solid rgba(184,174,232,0.35);
            border-radius: 14px;
            margin-bottom: 0.9rem;
        }
        .path-best-left { display: flex; align-items: center; gap: 0.8rem; }
        .path-best-icon { font-size: 2rem; filter: drop-shadow(0 0 6px rgba(184,174,232,0.5)); }
        .path-best-name { font-size: 1.15rem; font-weight: 600; color: var(--gold-light); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .path-best-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem; }
        .path-best-score { font-size: 2.2rem; font-weight: 700; color: var(--gold-light); line-height: 1; }
        .path-best-score small { font-size: 0.8rem; margin-left: 2px; color: var(--text-dim); }
        .path-summary { font-size: 0.88rem; color: var(--text-main); line-height: 1.7; margin-bottom: 1rem; }
        .path-bars { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1.1rem; }
        .path-bar-row {
            display: grid;
            grid-template-columns: 130px 1fr 38px 64px;
            align-items: center;
            gap: 0.6rem;
            padding: 0.35rem 0.5rem;
            border-radius: 10px;
        }
        .path-bar-row.is-best { background: rgba(184,174,232,0.08); border: 1px solid rgba(184,174,232,0.25); }
        .path-bar-label { font-size: 0.82rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .path-bar-label .icon { margin-right: 0.3rem; }
        .path-bar-track { background: rgba(26,34,38,0.6); border-radius: 6px; height: 10px; overflow: hidden; }
        .path-bar-fill { height: 100%; border-radius: 6px; transition: width 0.8s ease; }
        .path-bar-fill.lv-great { background: linear-gradient(90deg, #b8860b, #e9e6f6); box-shadow: 0 0 8px rgba(184,174,232,0.5); }
        .path-bar-fill.lv-good { background: linear-gradient(90deg, #b8aee8, #b8aee8); }
        .path-bar-fill.lv-mid { background: linear-gradient(90deg, #5a4bb0, #5b9bd4); }
        .path-bar-fill.lv-low { background: rgba(184,174,232,0.45); }
        .path-bar-fill.lv-poor { background: rgba(120,110,140,0.3); }
        .path-bar-score { font-size: 0.9rem; color: var(--gold-light); text-align: right; font-weight: 600; }
        .path-level-chip {
            font-size: 0.68rem;
            padding: 0.15rem 0.45rem;
            border-radius: 10px;
            white-space: nowrap;
            text-align: center;
        }
        .path-level-chip.lv-great { background: rgba(184,174,232,0.2); color: #e9e6f6; border: 1px solid rgba(184,174,232,0.45); }
        .path-level-chip.lv-good { background: rgba(184,174,232,0.18); color: #c6dcf2; border: 1px solid rgba(184,174,232,0.4); }
        .path-level-chip.lv-mid { background: rgba(91,155,212,0.15); color: #8ab8e0; border: 1px solid rgba(91,155,212,0.35); }
        .path-level-chip.lv-low { background: rgba(160,150,170,0.12); color: #a89fc4; border: 1px solid rgba(160,150,170,0.3); }
        .path-level-chip.lv-poor { background: rgba(255,107,107,0.1); color: #d98b8b; border: 1px solid rgba(255,107,107,0.3); }
        .path-features { margin-bottom: 0.8rem; }
        .path-features .k { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.5rem; }
        .path-features .v { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .path-advice { font-size: 0.88rem; color: var(--text-main); line-height: 1.75; }
        .path-note { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.6rem; }
        @media (max-width: 640px) {
            .path-bar-row { grid-template-columns: 96px 1fr 30px; }
            .path-bar-row .path-level-chip { display: none; }
            .path-best-score { font-size: 1.7rem; }
        }
        /* 特殊年份事件 - 横版卡片网格 */
        .se-intro { font-size: 0.86rem; color: var(--text-dim); line-height: 1.7; margin-bottom: 1rem; }
        .se-intro b { color: var(--gold-light); font-weight: 600; }
        .se-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.7rem;
        }
        .se-card {
            background: rgba(26,34,38,0.55);
            border: 1px solid rgba(184,174,232,0.16);
            border-radius: 12px;
            padding: 0.75rem 0.9rem 0.85rem;
            transition: border-color 0.2s;
        }
        .se-card:hover { border-color: rgba(184,174,232,0.4); }
        .se-card.recent {
            border-color: rgba(184,174,232,0.5);
            background: linear-gradient(135deg, rgba(184,174,232,0.08), rgba(26,34,38,0.55));
        }
        .se-card-head {
            display: flex; align-items: baseline; gap: 0.5rem;
            margin-bottom: 0.4rem; flex-wrap: wrap;
        }
        .se-card-year { font-size: 1.25rem; font-weight: 700; color: var(--gold-light); line-height: 1; }
        .se-card-age { font-size: 0.68rem; color: var(--text-dim); }
        .se-card-type {
            margin-left: auto;

    <script>
        /* 报告加载后：填充锚点导航（章节锚点跟随渲染的卡片标题） */
        function buildAnchorNav() {
            var nav = document.getElementById('anchorNav');
            if (!nav) return;
            setTimeout(function () {
                var cards = document.querySelectorAll('#reportContent .card');
                var items = [];
                Array.prototype.forEach.call(cards, function (c) {
                    var t = c.querySelector('.card-title');
                    if (!t) return;
                    var txt = t.textContent.replace(/^✦\s*/, '').trim();
                    if (!txt || txt.length > 14) return;
                    var id = 'sec-' + items.length;
                    c.id = c.id || id;
                    items.push({ id: c.id, text: txt });
                });
                if (items.length < 3) { nav.style.display = 'none'; return; }
                nav.innerHTML = items.map(function (it, i) {
                    return '<a href="#' + it.id + '" data-i="' + i + '">' + it.text + '</a>';
                }).join('');
                // 滚动高亮
                var links = nav.querySelectorAll('a');
                var tops = items.map(function (it) {
                    var el = document.getElementById(it.id);
                    return el ? el.offsetTop : 0;
                });
                function onScroll() {
                    var y = window.scrollY + 140;
                    var idx = 0;
                    for (var i = 0; i < tops.length; i++) if (y >= tops[i]) idx = i;
                    Array.prototype.forEach.call(links, function (a, i) {
                        a.classList.toggle('on', i === idx);
                    });
                }
                window.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
            }, 350);
        }
        document.addEventListener('DOMContentLoaded', buildAnchorNav);
        window.addEventListener('load', buildAnchorNav);

        /* 导出 PDF（沿用原逻辑：整页打印） */
        function exportPDF() { window.print(); }
    </script>
