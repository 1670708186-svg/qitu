<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>今日指引 · 王半仙</title>
    <link rel="stylesheet" href="css/starla.css?v=5">
    <style>
        
        .page-header { text-align: center; padding: 1.6rem 0 0.6rem; }
        .page-header .title {
            font-size: 1.55rem; color: var(--gold-light); letter-spacing: 6px;
        }
        .page-header .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.4rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
        .top-bar a { color: var(--gold); text-decoration: none; font-size: 0.9rem; }
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(124,107,214,0.18);
            border-radius: 14px;
            padding: 1rem 1.1rem;
            margin-bottom: 0.9rem;
            backdrop-filter: blur(6px);
        }
        .card-title {
            font-size: 0.95rem; color: var(--gold-light); letter-spacing: 2px;
            margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.4rem;
        }
        .card-title::before { content: '✦'; color: var(--gold); font-size: 0.75rem; }
        /* 日期头 */
        .date-hero { text-align: center; padding: 0.6rem 0 0.9rem; }
        .date-hero .d-date { font-size: 1.35rem; color: var(--gold-light); font-weight: 700; }
        .date-hero .d-week { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.25rem; }
        .date-hero .d-lunar { font-size: 0.82rem; color: var(--purple-light); margin-top: 0.3rem; }
        .gz-row {
            display: flex; justify-content: center; gap: 0.6rem; margin-top: 0.8rem; flex-wrap: wrap;
        }
        .gz-chip {
            background: rgba(10,10,30,0.55); border: 1px solid rgba(124,107,214,0.28);
            border-radius: 10px; padding: 0.45rem 0.75rem; text-align: center;
        }
        .gz-chip .k { font-size: 0.65rem; color: var(--text-dim); }
        .gz-chip .v { font-size: 1rem; color: var(--gold-light); font-family: "STKaiti","KaiTi",serif; }
        /* 评分环 */
        .score-wrap { display: flex; align-items: center; gap: 1.1rem; }
        .score-ring {
            width: 88px; height: 88px; border-radius: 50%; flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: conic-gradient(var(--ring-color, var(--gold)) calc(var(--pct,70)*1%), rgba(124,107,214,0.12) 0);
            position: relative;
        }
        .score-ring::before {
            content: ''; position: absolute; inset: 6px; border-radius: 50%;
            background: #162226;
        }
        .score-ring .num { position: relative; font-size: 1.5rem; font-weight: 700; color: var(--gold-light); }
        .score-ring .num small { font-size: 0.7rem; font-weight: 400; }
        .score-ring .lab { position: relative; font-size: 0.65rem; color: var(--text-dim); }
        .score-texts .t1 { font-size: 1rem; color: var(--gold-light); font-weight: 600; }
        .score-texts .t2 { font-size: 0.85rem; color: var(--text-main); margin-top: 0.3rem; line-height: 1.6; }
        /* 宜/忌 */
        .advice-row { display: flex; gap: 0.7rem; margin-top: 0.7rem; }
        .advice-box {
            flex: 1; border-radius: 10px; padding: 0.7rem 0.8rem; font-size: 0.83rem; line-height: 1.65;
        }
        .advice-box.yi { background: rgba(127,212,127,0.08); border: 1px solid rgba(127,212,127,0.3); }
        .advice-box.ji { background: rgba(255,107,107,0.07); border: 1px solid rgba(255,107,107,0.28); }
        .advice-box .hd { font-weight: 700; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .advice-box.yi .hd { color: #7fd47f; }
        .advice-box.ji .hd { color: #ff8b8b; }
        .advice-box .tx { color: var(--text-main); }
        /* 幸运四件套 */
        .luck-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; }
        .luck-item {
            background: rgba(10,10,30,0.5); border: 1px solid rgba(124,107,214,0.16);
            border-radius: 10px; padding: 0.65rem 0.3rem; text-align: center;
        }
        .luck-item .ic { font-size: 1.15rem; }
        .luck-item .k { font-size: 0.66rem; color: var(--text-dim); margin-top: 0.28rem; }
        .luck-item .v { font-size: 0.84rem; color: var(--gold-light); margin-top: 0.22rem; }
        .luck-item .v .dot {
            display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%;
            vertical-align: middle; margin-right: 3px; border: 1px solid rgba(255,255,255,0.3);
        }
        .luck-note {
            margin-top: 0.75rem; font-size: 0.8rem; color: var(--purple-light);
            background: rgba(124,107,214,0.08); border-left: 3px solid var(--purple-light);
            padding: 0.5rem 0.7rem; border-radius: 0 8px 8px 0; line-height: 1.6;
        }
        /* 时辰吉凶 */
        .hours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
        .hour-item {
            border-radius: 10px; padding: 0.5rem 0.3rem; text-align: center;
            background: rgba(10,10,30,0.5); border: 1px solid rgba(124,107,214,0.14);
        }
        .hour-item .h-name { font-size: 0.72rem; color: var(--text-dim); }
        .hour-item .h-level { font-size: 0.95rem; margin-top: 0.2rem; font-weight: 700; }
        .hour-item.ji { border-color: rgba(124,107,214,0.55); background: rgba(124,107,214,0.1); }
        .hour-item.ji .h-level { color: var(--gold-light); text-shadow: 0 0 8px rgba(124,107,214,0.5); }
        .hour-item.xiong .h-level { color: #ff8b8b; }
        .hour-item.ping .h-level { color: var(--text-dim); font-weight: 400; }
        .hour-legend { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.6rem; text-align: right; }
        .loading { text-align: center; padding: 3rem 1rem; color: var(--text-dim); }
        .spinner {
            width: 36px; height: 36px; margin: 0 auto 0.9rem; border-radius: 50%;
            border: 3px solid rgba(124,107,214,0.2); border-top-color: var(--gold);
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 520px) {
            .luck-grid { grid-template-columns: repeat(2, 1fr); }
            .hours-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a2226">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="王半仙">
    <link rel="apple-touch-startup-image" href="img/icons/startup-390x844.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="img/icons/startup-430x932.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="img/icons/startup-375x812.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icons/icon-192.png">
    <script src="js/config.js?v=1"></script>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="spirit-glow"></div>
    <canvas id="spirit-canvas"></canvas>

    <div class="container">
        <div class="top-bar">
            <a href="index.html">← 首页</a>
            <a href="mine.html">矿脉地图 →</a>
        </div>

        <div class="page-header">
            <div class="title serif-title">今 日 指 引</div>
            <div class="subtitle">流日十神 · 为你排布今日节奏</div>
        </div>

        <div id="content">
            <div id="jinnangSlot"></div>
            <div class="loading" id="jinnangLoading">
                <div class="spinner"></div>
                <div>正在演算今日星象…</div>
            </div>
        </div>

        <!-- 每日地图扩展模块（今日形态/寄语/倒计时/预测/吉日/入口） -->
        <div id="dailyExtras"></div>

        <div class="disclaimer">
            本页内容基于传统五行、性格分析等文化元素，仅作职场心理调适与娱乐参考，不构成任何决策依据。
        </div>
    </div>

    <script src="js/starfield.js?v=5"></script>
    <script src="js/daily-jinnang.js?v=1"></script>
    <script src="js/daily-extras.js?v=1"></script>
    <script>
        const LEVEL_TXT = { '吉': 'ji', '凶': 'xiong', '平': 'ping' };

        async function load() {
            const rid = sessionStorage.getItem('currentReportId');
            let data, personalized = false;
            try {
                const url = rid
                    ? `${window.API_BASE}/api/daily/personal?report_id=${encodeURIComponent(rid)}`
                    : window.API_BASE + '/api/daily/personal';
                const resp = await fetch(url);
                data = await resp.json();
                personalized = !!data.personal;
            } catch (e) {
                const resp = await fetch(window.API_BASE + '/api/daily');
                data = await resp.json();
            }
            render(data, personalized);
        }

        function render(d, personalized) {
            const p = d.personal || {};
            const gz = d.today_ganzhi || {};
            const ringColor = d.color || '#b8aee8';
            const hours = d.lucky_hours || [];

            const luckGrid = personalized ? `
            <div class="card">
                <div class="card-title">今日幸运加持</div>
                <div class="luck-grid">
                    <div class="luck-item">
                        <div class="ic">🎨</div>
                        <div class="k">幸运色</div>
                        <div class="v"><span class="dot" style="background:${p.lucky_color_hex || '#b8aee8'}"></span>${p.lucky_color || '—'}</div>
                    </div>
                    <div class="luck-item">
                        <div class="ic">🧭</div>
                        <div class="k">幸运方位</div>
                        <div class="v">${p.lucky_direction || '—'}</div>
                    </div>
                    <div class="luck-item">
                        <div class="ic">🔢</div>
                        <div class="k">幸运数字</div>
                        <div class="v">${(p.lucky_numbers || []).join('、') || '—'}</div>
                    </div>
                    <div class="luck-item">
                        <div class="ic">🎁</div>
                        <div class="k">随身小物</div>
                        <div class="v" style="font-size:0.72rem;line-height:1.4">${p.lucky_items || '—'}</div>
                    </div>
                </div>
                <div class="luck-note">${p.note || ''}</div>
            </div>` : '';

            const hoursCard = hours.length ? `
            <div class="card">
                <div class="card-title">十二时辰吉凶</div>
                <div class="hours-grid">
                    ${hours.map(h => `
                    <div class="hour-item ${LEVEL_TXT[h.level] || 'ping'}">
                        <div class="h-name">${h.hour}</div>
                        <div class="h-level">${h.level}</div>
                    </div>`).join('')}
                </div>
                <div class="hour-legend">以日支六合/三合为吉、六冲为凶推演</div>
            </div>` : '';

            document.getElementById('content').innerHTML = `
            <div class="card">
                <div class="date-hero">
                    <div class="d-date">${d.date || ''} · 周${d.weekday || ''}</div>
                    <div class="d-lunar">${d.lunar || ''}</div>
                    <div class="gz-row">
                        <div class="gz-chip"><div class="k">流年</div><div class="v">${gz.year || ''}</div></div>
                        <div class="gz-chip"><div class="k">流月</div><div class="v">${gz.month || ''}</div></div>
                        <div class="gz-chip"><div class="k">流日</div><div class="v">${gz.day || ''}</div></div>
                        <div class="gz-chip"><div class="k">生肖</div><div class="v">${gz.shengxiao || ''}</div></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">今日运势${d.shishen ? ' · ' + d.shishen + '当值' : ''}</div>
                <div class="score-wrap">
                    <div class="score-ring" style="--pct:${d.score || 70}; --ring-color:${ringColor}">
                        <div class="num">${d.score || '—'}<small>分</small></div>
                        <div class="lab">运势指数</div>
                    </div>
                    <div class="score-texts">
                        <div class="t1">${d.fortune || ''}</div>
                        <div class="t2">${d.energy || ''}</div>
                    </div>
                </div>
                <div class="advice-row">
                    <div class="advice-box yi">
                        <div class="hd">宜</div>
                        <div class="tx">${(d.advice || '').replace(/^适合：/, '')}</div>
                    </div>
                    <div class="advice-box ji">
                        <div class="hd">忌</div>
                        <div class="tx">${(d.avoid || '').replace(/^避免：/, '')}</div>
                    </div>
                </div>
            </div>

            ${luckGrid}
            ${hoursCard}

            <div class="card">
                <div class="card-title">节气 · 星座</div>
                <div class="score-texts" style="font-size:0.85rem;color:var(--text-main);line-height:1.8">
                    当前节气：${(d.jieqi && d.jieqi.prev) || '—'}　→　下一节气：${(d.jieqi && d.jieqi.next) || '—'}<br>
                    今日星座：${d.zodiac || '—'}座
                </div>
            </div>`;

            document.querySelector('.subtitle').textContent = personalized
                ? '已结合你的命盘用神个性化推演'
                : '通用流日推演 · 生成报告后可解锁个性化指引';
        }

        load();
    </script>
    <script src="js/glow-orb.js?v=1"></script>
    <script src="js/tabbar.js?v=5"></script>
</body>
</html>
